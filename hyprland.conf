# SPECTRE Hyprland Integration Rules
# Add these rules to ~/.config/hyprland/hyprland.conf
# or copy this file to ~/.config/hyprland/hyprland.conf

# Window rulev2 patterns for class: ^(spectre)$ with transparency, noborder, pin, noanim settings
windowrulev2 = float, class:^(spectre)$
windowrulev2 = noborder, class:^(spectre)$
windowrulev2 = pin, class:^(spectre)$
windowrulev2 = noanim, class:^(spectre)$
windowrulev2 = transparent 0.95, class:^(spectre)$
